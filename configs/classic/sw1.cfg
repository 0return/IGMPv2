echo "Service Configuration"
#--------------------------------------------------
    service
        customer 1 name "1" create
            description "Default customer"
        exit
        vpls 100 name "100" customer 1 create
            stp
                shutdown
            exit
            sap 1/1/c1/1 create
                no shutdown
            exit
            sap 1/1/c2/1 create
                no shutdown
            exit
            sap 1/1/c3/1 create
                no shutdown
            exit
            sap 1/1/c4/1 create
                no shutdown
            exit
            no shutdown
        exit
        vpls 200 name "200" customer 1 create
            stp
                shutdown
            exit
            igmp-snooping
                no shutdown
            exit
            sap 1/1/c5/1 create
                igmp-snooping
                    version 2
                exit
                no shutdown
            exit
            sap 1/1/c6/1 create
                no shutdown
            exit
            sap 1/2/c1/1 create
                no shutdown
            exit
            sap 1/2/c2/1 create       
                no shutdown
            exit
            no shutdown
        exit
    exit
